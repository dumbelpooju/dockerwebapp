version: "3.9"

services:
  devopsdb:
    image: poojadumbel/automation2:db
    ports:
      - "3306:3306"
    networks:
      - mynetwork
  application:
    image: poojadumbel/automation2:app
    ports:
      - "1111:8080"
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay


