version: "3.9"

services:
  devopsdb:
    image: poojadumbel/automation2:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 3
    networks:
      - mynetwork
  application:
    image: poojadumbel/automation2:app
    ports:
      - "1111:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay


